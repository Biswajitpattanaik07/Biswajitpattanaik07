<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072FF">
        <animate attributeName="stop-color" values="#0072FF;#8A2BE2;#DD2476;#0072FF" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00C9A7">
        <animate attributeName="stop-color" values="#00C9A7;#0072FF;#8A2BE2;#00C9A7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#DD2476">
        <animate attributeName="stop-color" values="#DD2476;#00C9A7;#FF512F;#DD2476" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#bgGrad)" opacity="0.18"/>

  <circle cx="120" cy="70" r="6" fill="#0072FF" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-18; 0,0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="60" r="5" fill="#00C9A7" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,16; 0,0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="230" r="4" fill="#8A2BE2" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 14,0; 0,0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="240" r="7" fill="#DD2476" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; -16,0; 0,0" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="40" r="5" fill="#FF512F" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,14; 0,0" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#f5f5f5">
    Hi 👋, I'm Biswajit Pattanaik
  </text>
  <text x="600" y="195" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="22" font-weight="500" fill="#00C9A7">
    Embedded Systems · IoT · AI/ML · Full-Stack Developer
  </text>
</svg>
