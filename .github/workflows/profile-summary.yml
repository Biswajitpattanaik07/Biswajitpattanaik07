name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-summary
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Classic PAT with scopes: repo, read:user
          GITHUB_TOKEN: ${{ secrets.PAT }}
        with:
          USERNAME: Biswajitpattanaik07
          UTC_OFFSET: 5
          AUTO_PUSH: true
          # EXCLUDE: "repo1,repo2"   # optional: repos to ignore
