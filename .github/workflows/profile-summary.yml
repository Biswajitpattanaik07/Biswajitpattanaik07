name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual run button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Use a Personal Access Token (classic) with scopes: repo, read:user
          # Save it in Settings > Secrets and variables > Actions as PAT
          GITHUB_TOKEN: ${{ secrets.PAT }}
        with:
          USERNAME: Biswajitpattanaik07
